services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/cinema?sslmode=disable
      JWT_SECRET: super-secret-mkp-key
      JWT_TTL: 24h
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
